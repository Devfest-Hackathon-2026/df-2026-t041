<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
  body { margin: 0; background: #ffffff; font-family: "Noto Sans JP", sans-serif; }
  #diagram { width: 1600px; height: 900px; position: relative; }
  svg text { font-family: "Noto Sans JP", sans-serif; }
</style>
</head>
<body>
<div id="diagram">
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <text x="60" y="70" font-size="34" font-weight="700" fill="#202124">ビラ・POPメーカー　Google Cloud アーキテクチャ</text>
  <text x="60" y="108" font-size="20" fill="#5f6368">AIはレイアウトの設計図（JSON）を作り、サーバーで検証・修復してから、編集可能なキャンバスに組み立てる</text>

  <!-- User / Browser -->
  <rect x="60" y="170" width="430" height="620" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
  <text x="90" y="215" font-size="24" font-weight="700" fill="#202124">ブラウザ（店主のPC・スマホ）</text>
  <g font-size="19" fill="#3c4043">
    <rect x="90" y="245" width="370" height="96" rx="12" fill="#fff" stroke="#dadce0"/>
    <text x="110" y="283" font-weight="700">新規作成ウィザード</text>
    <text x="110" y="315">商品名・価格・写真・一言の指示</text>
    <rect x="90" y="361" width="370" height="96" rx="12" fill="#fff" stroke="#dadce0"/>
    <text x="110" y="399" font-weight="700">キャンバスエディタ</text>
    <text x="110" y="431">Fabric.js　全要素を手で編集・元に戻す</text>
    <rect x="90" y="477" width="370" height="96" rx="12" fill="#fff" stroke="#dadce0"/>
    <text x="110" y="515" font-weight="700">書き出し</text>
    <text x="110" y="547">PNG 300dpi / 印刷用PDF（pdf-lib）</text>
    <rect x="90" y="593" width="370" height="96" rx="12" fill="#fff" stroke="#dadce0"/>
    <text x="110" y="631" font-weight="700">IndexedDB に自動保存</text>
    <text x="110" y="663">ログイン不要・写真はサーバーに残らない</text>
  </g>
  <text x="90" y="735" font-size="17" fill="#5f6368">Next.js 16 / React 19 / TypeScript</text>
  <text x="90" y="762" font-size="17" fill="#5f6368">書体：Google Fonts から必要なときだけ読み込み（30書体）</text>

  <!-- Google Cloud boundary -->
  <rect x="600" y="140" width="950" height="700" rx="20" fill="#e8f0fe" fill-opacity="0.35" stroke="#1a73e8" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="630" y="185" font-size="24" font-weight="700" fill="#1a73e8">Google Cloud（プロジェクト／asia-northeast1）</text>

  <!-- Cloud Run -->
  <rect x="640" y="220" width="460" height="400" rx="16" fill="#ffffff" stroke="#1a73e8" stroke-width="2.5"/>
  <circle cx="680" cy="262" r="20" fill="#4285f4"/>
  <text x="680" y="269" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">R</text>
  <text x="712" y="270" font-size="24" font-weight="700" fill="#202124">Cloud Run</text>
  <text x="860" y="270" font-size="16" fill="#5f6368">Next.js サーバー（コンテナ）</text>
  <g font-size="18" fill="#3c4043">
    <rect x="665" y="300" width="410" height="84" rx="10" fill="#f1f3f4"/>
    <text x="685" y="334" font-weight="700">/api/ai/generate　/api/ai/refine</text>
    <text x="685" y="364">入力を zod で検証し、Gemini を呼ぶ</text>
    <rect x="665" y="398" width="410" height="200" rx="10" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="685" y="432" font-weight="700" fill="#b06000">AI出力の検証・修復（鵜呑みにしない）</text>
    <text x="685" y="466">・価格は入力値で上書き</text>
    <text x="685" y="496">・はみ出した文字を紙面内へ戻す</text>
    <text x="685" y="526">・短い文字は1行に収める</text>
    <text x="685" y="556">・装飾は文字の背面へ／不正な値を変換</text>
    <text x="685" y="586">・失敗時は内蔵のルールベース生成で続行</text>
  </g>
  <text x="770" y="650" font-size="16" fill="#5f6368">最大3台・アクセスがないときは0台／1回45秒で打ち切り</text>

  <!-- Vertex AI -->
  <rect x="1180" y="220" width="340" height="190" rx="16" fill="#ffffff" stroke="#34a853" stroke-width="2.5"/>
  <circle cx="1220" cy="262" r="20" fill="#34a853"/>
  <text x="1220" y="269" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
  <text x="1252" y="270" font-size="24" font-weight="700" fill="#202124">Vertex AI</text>
  <g font-size="18" fill="#3c4043">
    <text x="1205" y="315" font-weight="700">Gemini 3 Flash</text>
    <text x="1205" y="345">レイアウト3案の提案</text>
    <text x="1205" y="373">日本語指示での差分修正</text>
    <text x="1205" y="395" font-size="15" fill="#5f6368">JSONモード／思考レベル LOW</text>
  </g>

  <!-- IAM -->
  <rect x="1180" y="440" width="340" height="120" rx="16" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
  <text x="1205" y="482" font-size="21" font-weight="700" fill="#202124">IAM サービスアカウント</text>
  <text x="1205" y="514" font-size="17" fill="#3c4043">Vertex AI ユーザー権限のみ</text>
  <text x="1205" y="540" font-size="17" fill="#3c4043">APIキーを保存しない</text>

  <!-- Build pipeline -->
  <rect x="640" y="690" width="420" height="120" rx="16" fill="#ffffff" stroke="#ea4335" stroke-width="2"/>
  <text x="665" y="732" font-size="21" font-weight="700" fill="#202124">Cloud Build → Artifact Registry</text>
  <text x="665" y="764" font-size="17" fill="#3c4043">Dockerfile からビルドしてイメージを保管</text>
  <text x="665" y="790" font-size="17" fill="#3c4043">gcloud run deploy --source .</text>

  <rect x="1180" y="690" width="340" height="120" rx="16" fill="#ffffff" stroke="#fbbc04" stroke-width="2"/>
  <text x="1205" y="732" font-size="21" font-weight="700" fill="#202124">Cloud Billing</text>
  <text x="1205" y="764" font-size="17" fill="#3c4043">予算アラート（月1,000円）</text>
  <text x="1205" y="790" font-size="17" fill="#3c4043">50%・90%・100%・予測で通知</text>

  <!-- arrows -->
  <path d="M490 330 C 560 330, 570 330, 640 330" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#arrB)"/>
  <text x="497" y="318" font-size="16" fill="#1a73e8">HTTPS</text>
  <path d="M640 380 C 570 380, 560 410, 490 410" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="497" y="440" font-size="16" fill="#5f6368">検証済みの</text>
  <text x="497" y="462" font-size="16" fill="#5f6368">デザイン仕様</text>
  <path d="M1100 300 L 1180 300" stroke="#34a853" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M1180 350 L 1100 350" stroke="#34a853" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M1100 500 L 1180 500" stroke="#9aa0a6" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <path d="M700 690 L 700 620" stroke="#ea4335" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="712" y="675" font-size="16" fill="#ea4335">デプロイ</text>
</svg>
</div>
</body>
</html>
